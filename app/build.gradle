// ماژول اصلی برنامه گالاتا؛ applicationId ثابت است تا Releaseهای آینده روی نسخه قبلی نصب شوند.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// اگر Workflow یا سیستم توسعه کلید دائمی را از محیط تزریق کند، Release با همان کلید امضا می‌شود.
// کلید خصوصی عمداً داخل ریپوی عمومی Commit نمی‌شود.
def releaseKeystorePath = System.getenv('GALATA_KEYSTORE_PATH')
def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.trim().isEmpty()

android {
    namespace 'com.asteam.galata'
    compileSdk 35

    defaultConfig {
        applicationId 'com.asteam.galata'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('GALATA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GALATA_KEY_ALIAS')
                keyPassword System.getenv('GALATA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Debug بسته جدا دارد تا روی اطلاعات نسخه Publish اثر نگذارد.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
