// ماژول اصلی برنامه گالاتا.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.asteam.galata'
    compileSdk 35

    defaultConfig {
        // applicationId ثابت می‌ماند تا نسخه جدید روی نسخه قبلی نصب شود و داده‌ها حفظ شوند.
        applicationId 'com.asteam.galata'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // فقط برای نسخه تست؛ انتشار نهایی باید با keystore دائمی امضا شود.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// DrawerLayout واقعی برای منوی همبرگری کشویی سمت راست.
dependencies {
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
