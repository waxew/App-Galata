// ماژول اصلی برنامه گالاتا؛ applicationId عمداً ثابت است تا نسخه‌های بعدی روی نسخه قبلی نصب شوند.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.asteam.galata'
    compileSdk 35

    defaultConfig {
        applicationId 'com.asteam.galata'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            // نسخه Debug فقط برای تست توسعه است.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // کلید خصوصی انتشار داخل ریپوی عمومی نگهداری نمی‌شود.
            // Workflow در صورت وجود Secrets، signingConfig را از متغیرهای محیطی می‌سازد.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // DrawerLayout برای منوی همبرگری استاندارد و راست‌به‌چپ.
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
