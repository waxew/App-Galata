// ماژول اصلی برنامه گالاتا.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.asteam.galata'
    compileSdk 35

    defaultConfig {
        applicationId 'com.asteam.galata'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // فقط برای نسخه تست؛ انتشار نهایی باید با keystore دائمی امضا شود.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
