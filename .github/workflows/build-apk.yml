# Build و QA خودکار گالاتا. Release بدون Secret به صورت unsigned ساخته می‌شود؛
# برای انتشار واقعی، Keystore دائمی باید فقط در GitHub Secrets یا سیستم امن Build تزریق شود.
name: Build Galata APK
on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # اگر Secret کلید دائمی تعریف شده باشد، فقط در فضای موقت Runner بازسازی می‌شود.
      - name: Prepare release signing
        env:
          GALATA_KEYSTORE_B64: ${{ secrets.GALATA_KEYSTORE_B64 }}
        run: |
          if [ -n "$GALATA_KEYSTORE_B64" ]; then
            echo "$GALATA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/galata-release.jks"
            echo "GALATA_KEYSTORE_PATH=$RUNNER_TEMP/galata-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug and release
        env:
          GALATA_KEYSTORE_PASSWORD: ${{ secrets.GALATA_KEYSTORE_PASSWORD }}
          GALATA_KEY_ALIAS: ${{ secrets.GALATA_KEY_ALIAS }}
          GALATA_KEY_PASSWORD: ${{ secrets.GALATA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APKs and checksums
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Galata-v1.0.0-debug.apk
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$RELEASE_APK" artifacts/Galata-v1.0.0-release.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          if apksigner verify --verbose artifacts/Galata-v1.0.0-release.apk > artifacts/release-signature.txt 2>&1; then
            echo "Release signature verification: PASS" >> artifacts/release-signature.txt
          else
            echo "Release signature verification: UNSIGNED - configure GitHub Secrets for publish signing" >> artifacts/release-signature.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Galata-v1.0.0-build
          path: artifacts/
